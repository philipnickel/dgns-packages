# mfem-dgns for the dgns conda channel (README.md): stock upstream
# MFEM 4.10.0, no source patches, with the solver's feature set (build.sh).
# MPI is a variant (../variants.yaml); the MPI run dependency comes from the
# MPI package's run_exports. On linux-64 one x86-64-v3 build (conda-forge's
# microarch-level helper, ../variants.yaml).
#
# hypre's index width is a variant too (hypre_int, ../variants.yaml): the
# default "32" builds against conda-forge's hypre (32-bit HYPRE_BigInt), with
# PETSc; "mixed" builds against hypre-dgns (../hypre: 64-bit HYPRE_BigInt,
# 32-bit HYPRE_Int), for spaces past 2^31 global dofs. The mixed-int build has
# no PETSc: conda-forge's PETSc links the 32-bit hypre, and MFEM requires the
# two to agree on the index width (linalg/petsc.hpp). Its build string starts
# with mixedint_ and it is down-prioritized, so a consumer gets it only by
# asking for build = "mixedint_*".
context:
  version: 4.10.0.post6
  mfem_version: 4.10.0
  build: 0
  # The preferred (highest) microarchitecture level gets the highest build
  # number, so the solver installs it wherever __archspec allows.
  build_number: ${{ build + 100 * (microarch_level | int - 1) }}
  mixedint: ${{ hypre_int == "mixed" }}

package:
  name: mfem-dgns
  version: ${{ version }}

source:
  # Upstream release v4.10 (commit d964264cdb9a13e94a201b6c236c7721e0c8765f).
  url: https://github.com/mfem/mfem/archive/refs/tags/v4.10.tar.gz
  sha256: d5aabe991b8b5569aa26e2b5d4b59ac617ee10ebac3d45fd6ff9c74b2c1a47dd

build:
  number: ${{ build_number }}
  string: ${{ "mixedint_" if mixedint else "" }}mpi_${{ mpi }}_h${{ hash }}_${{ build_number }}
  script:
    file: build.sh
    env:
      MFEM_HYPRE_INT: ${{ hypre_int }}
  variant:
    # The hash leaves hypre_int out, so the default build keeps the hash it
    # had before the key existed (already on the channel); the two builds
    # differ by the mixedint_ prefix. track_features keep the default first.
    ignore_keys:
      - hypre_int
    down_prioritize_variant: ${{ 1 if mixedint else 0 }}

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    # The glibc floor (../variants.yaml c_stdlib_version).
    - ${{ stdlib('c') }}
    # Same compiler pins as caliper, gslib, reflect-cpp and the solver.
    - if: linux
      then: gcc_linux-64 14.*
    - if: linux
      then: gxx_linux-64 14.*
    - if: linux and x86_64
      then: x86_64-microarch-level ==${{ microarch_level }}
    - cmake >=3.24
    - ninja
    # MFEM's FindPETSc reads PETSc's petscvariables through make.
    - make
  host:
    - ${{ mpi }}
    # hypre 3.x builds carry no mpi_ string; the host MPI selects the build.
    - if: mixedint
      then: hypre-dgns 3.2.* mixedint_mpi_${{ mpi }}_*
      else: hypre 3.2.*
    - metis 5.*
    - zlib
    # OpenBLAS explicitly: with PETSc's link line, libmfem's DT_NEEDED is
    # OpenBLAS itself, not the switchable libblas.so.3, so consumers must get
    # libopenblas (its run_exports), not whatever BLAS the solver picks.
    - libblas * *openblas
    - liblapack * *openblas
    - libopenblas
    - hdf5 * mpi_${{ mpi }}_*
    - caliper 2.15.* mpi_${{ mpi }}_*
    - gslib 1.0.9.* mpi_${{ mpi }}_*
    # conda-forge's real-scalar PETSc, built with hypre (MFEM requires it)
    # and with the host MPI (the build string carries no mpi_; the MPI
    # selects the build, as for hypre). Not with the mixed-int hypre.
    - if: not mixedint
      then: petsc 3.26.* real_*
  run:
    # mfem.hpp includes the hypre, METIS, zlib, HDF5, Caliper and PETSc headers, so
    # consumers need the development packages; versions come from run_exports.
    - if: mixedint
      then: hypre-dgns
      else: hypre
    - if: not mixedint
      then: petsc
    - libopenblas
    - metis
    - zlib
    - hdf5 * mpi_${{ mpi }}_*
  run_exports:
    - ${{ pin_subpackage('mfem-dgns', exact=True) }}

tests:
  - package_contents:
      include:
        - mfem.hpp
        - mfem/config/_config.hpp
      lib:
        - mfem
      files:
        - lib/cmake/mfem/MFEMConfig.cmake
        - share/mfem/config.mk
  - script:
      - grep -q '^#define MFEM_USE_MPI' $PREFIX/include/mfem/config/_config.hpp
      - grep -q '^#define MFEM_USE_GSLIB' $PREFIX/include/mfem/config/_config.hpp
      - grep -q '^#define MFEM_USE_CALIPER' $PREFIX/include/mfem/config/_config.hpp
      - grep -q '^#define MFEM_USE_HDF5' $PREFIX/include/mfem/config/_config.hpp
      - if: mixedint
        then:
          - "! grep -q '^#define MFEM_USE_PETSC' $PREFIX/include/mfem/config/_config.hpp"
          - grep -q '^#define HYPRE_MIXEDINT 1' $PREFIX/include/HYPRE_config.h
        else:
          - grep -q '^#define MFEM_USE_PETSC' $PREFIX/include/mfem/config/_config.hpp
      - "! grep -q '^#define MFEM_THREAD_SAFE' $PREFIX/include/mfem/config/_config.hpp"
      - "! grep -q '^#define MFEM_USE_MPFR' $PREFIX/include/mfem/config/_config.hpp"
      - "! grep -q '^#define MFEM_USE_CEED' $PREFIX/include/mfem/config/_config.hpp"
      # MFEM's parallel VTKHDF path needs an HDF5 built with MPI-IO.
      - grep -q '^#define H5_HAVE_PARALLEL 1' $PREFIX/include/H5pubconf.h
      - cmake -S test-cmake -B build-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DEXPECT_HYPRE_MIXEDINT=${{ "ON" if mixedint else "OFF" }}
      - cmake --build build-consumer
      - mpiexec -n 2 build-consumer/parmesh_smoke
      # Caliper reports the consumer's MFEM_PERF_SCOPE region when enabled.
      - env CALI_CONFIG=runtime-report mpiexec -n 2 build-consumer/parmesh_smoke > caliper-report.txt 2>&1
      - cat caliper-report.txt
      - grep -q 'parmesh_smoke' caliper-report.txt
      # Two ranks write one shared VTKHDF file (ParMesh + GridFunction, two cycles).
      - mpiexec -n 2 build-consumer/hdf5_smoke
      # A Poisson solve through MFEM's PETSc wrappers: CG with GAMG on 2 ranks.
      - if: not mixedint
        then: mpiexec -n 2 build-consumer/petsc_smoke
      # MFEM's hypre path: HypreParMatrix, BoomerAMG and HyprePCG on 2 ranks,
      # with the index widths of the hypre it was built against.
      - mpiexec -n 2 build-consumer/hypre_smoke
      - test -s hdf5-out/hdf5_smoke.vtkhdf
      - ls -l hdf5-out
    requirements:
      run:
        - ${{ compiler('cxx') }}
        - cmake >=3.24
        - ninja
    files:
      recipe:
        - test-cmake/

about:
  homepage: https://mfem.org
  repository: https://github.com/mfem/mfem
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Stock MFEM 4.10 C++ library (MPI, HDF5, GSLIB, Caliper, PETSc) for dgns
  description: |
    Stock upstream MFEM 4.10.0 (no patches) built as a shared library with
    MPI, hypre, METIS, zlib, LAPACK, GSLIB, Caliper, parallel HDF5
    (ParaViewHDFDataCollection) and PETSc (conda-forge's real build, with
    hypre; since post6). MPFR, thread safety, libCEED, OpenMP and GPU
    backends are off. One build per MPI variant; on linux-64 a generic and an
    x86-64-v3 build.
