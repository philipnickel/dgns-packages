# Build variants shared by the recipes (caliper, gslib, mfem, reflect-cpp).
# Each recipe directory links its variants.yaml here, so a plain
# `rattler-build build --recipe <name>` picks them up.

# The C standard library the packages are built against: conda-forge's
# sysroot with glibc 2.28 on linux (runs on DTU's 2.34 and LUMI's SLES 15
# 2.31; the build machine's newer glibc made libmfem need 2.35 and
# libcaliper 2.38, 2026-10-28), and the macOS deployment target. stdlib('c')
# also adds the matching __glibc / __osx run requirement.
c_stdlib:
  - if: linux
    then: sysroot
  - if: osx
    then: macosx_deployment_target
c_stdlib_version:
  - if: linux
    then: "2.28"
  - if: osx
    then: "11.0"
#
# MPI implementation: the MPICH ABI (libmpi.so.12, dgns#122). One build runs
# on conda-forge's mpich (laptop) and, through mpich=*=external_*, on the
# site MPI of the clusters: Intel MPI on DTU, Cray MPICH on LUMI. Open MPI
# builds (mpi_openmpi_*, until 2026-11-03) stay on the channel for older
# checkouts.
mpi:
  - mpich

# x86-64 microarchitecture level of mfem-dgns (conda-forge's microarch-level
# helper, knowledge base "Microarchitecture-optimized builds"): one
# x86-64-v3 (AVX2, FMA) build on linux-64. Every machine the solver runs on
# supports it (README.md, "Variants"); the solver workspace declares its
# linux-64 platform as x86_64_v3 so the lock resolves it. Only the mfem
# recipe uses this key; osx-arm64 builds once (the value is unused there).
microarch_level:
  - if: linux and x86_64
    then: 3
  - if: osx
    then: 1
